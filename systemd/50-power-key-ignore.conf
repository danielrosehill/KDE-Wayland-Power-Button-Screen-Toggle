# /etc/systemd/logind.conf.d/50-power-key-ignore.conf
# logind never powers off / suspends on the power, suspend or hibernate keys.
# (Belt and braces: while screen-toggle runs it holds the power button exclusively anyway;
#  this also covers the login screen and the moments before/after the service runs.)
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
